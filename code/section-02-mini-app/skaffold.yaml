apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: posts-app
build:
  local:
    push: false
  artifacts:
    - image: client
      context: client
    - image: comments
      context: comments
    - image: event-bus
      context: event-bus
    - image: moderation
      context: moderation
    - image: posts
      context: posts
    - image: query
      context: query
manifests:
  rawYaml:
    - infra/k8s/client-deployment.yaml
    - infra/k8s/deployments.yaml
    - infra/k8s/ingress-service.yaml
    - infra/k8s/services.yaml
